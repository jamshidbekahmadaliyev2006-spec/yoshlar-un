<div class="fg" style="align-content:start"><div class="card"><div class="lb">Tadbir rasmi</div><label class="up2" for="af">${ic('up')}<div style="font-weight:600;margin-top:6px">Rasm yuklash</div><div class="sm">PNG, JPG (maks. 5MB)</div></label><input class="vh" id="af" type="file" accept="image/png,image/jpeg"><div class="er" id="e-af"></div><div class="prv" id="prev">${AF.img?`<img src="${AF.img}" alt="Tanlangan rasm">`:''}</div></div><div class="card"><div class="lb">Lokatsiya (kartadan tanlang)</div><div class="mapw"><div id="am" style="height:100%">${mapH({sel:AF.loc})}</div></div></div></div></div><div class="btr"><button class="bt g" data-act="cancel">Bekor qilish</button><button class="bt" data-act="save">Saqlash</button></div>`}
const FB='<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Futbol maydoni"><rect width="400" height="200" fill="#3f9b4a"/><g fill="#4aa956"><rect width="50" height="200"/><rect x="100" width="50" height="200"/><rect x="200" width="50" height="200"/><rect x="300" width="50" height="200"/></g><circle cx="200" cy="100" r="46" fill="none" stroke="#fff" stroke-width="2"/><path d="M200 0V200" stroke="#fff" stroke-width="2"/><circle cx="200" cy="100" r="16" fill="#fff" stroke="#10264d" stroke-width="2"/></svg>';
const parts=(e,n)=>Array.from({length:n},(_,k)=>US[(e.id*5+k)%US.length]);
function det(id){const e=EV.find(x=>x.id===id);if(!e)return '<div class="card">Tadbir topilmadi. <a href="#dashboard">Dashboardga qaytish</a></div>';
const l=LOCS[e.loc],r=REG.includes(id),dl=new Date(e.date+'T00:00');dl.setDate(dl.getDate()-1);const ir=(k,t)=>`<div class="ir">${ic(k)}<span>${t}</span></div>`;
const img=e.img?`<img src="${e.img}" alt="${E(e.title)}">`:e.t===0?FB:`<svg viewBox="0 0 400 200" preserveAspectRatio="xMidYMid slice" role="img" aria-label="${TYPES[e.t]}"><rect width="400" height="200" fill="${COL[e.t]}"/><rect width="400" height="200" fill="#0b0420" opacity=".45"/><text x="200" y="112" text-anchor="middle" font-size="34" font-weight="700" fill="#fff">${TYPES[e.t]}</text></svg>`;
return `<div class="dg"><div class="card"><div class="eimg">${img}</div><h2 style="margin:0 0 10px;font-size:20px">${E(e.title)}</h2><span class="tag">${TYPES[e.t]}</span> <span class="tag" style="background:var(--okb);color:var(--ok)">Ochiq</span>${ir('cal',fd(e.date,1)+', '+e.time)}${ir('pin',E(l.n))}${ir('users',e.ages)}${ir('clock','Ro‘yxatdan o‘tish: '+dl.getDate()+'-'+MN[dl.getMonth()]+'gacha')}<h3 style="font-size:14px;margin:18px 0 6px">Tadbir haqida</h3><p class="sm" style="margin:0 0 18px;line-height:1.6">${E(e.desc)}</p><button class="bt" style="width:100%" data-act="reg" data-id="${id}">${r?'Ro‘yxatdan o‘tildi ✓ (bekor qilish)':'Ro‘yxatdan o‘tish'}</button></div>
<div class="fg"><div class="card"><h2 class="h">Lokatsiya</h2><div class="mapw">${mapH({only:e.loc})}</div><div style="margin:12px 0">${E(l.n)}</div><a class="bt g" style="width:100%" target="_blank" rel="noopener" href="https://www.google.com/maps/search/?api=1&query=${encodeURIComponent('Yunusobod '+l.n)}">Yo‘l ko‘rsatish</a></div>
<div class="card"><h2 class="h">Qatnashuvchilar</h2><div class="avs">${parts(e,4).map((u,k)=>`<i style="background:${COL[k]}" aria-hidden="true">${u.n[0]}</i>`).join('')}<span class="sm" style="margin-left:10px;font-weight:600">+${e.going+(r?1:0)}</span></div><div style="text-align:right;margin-top:10px"><button class="cbt" data-act="all" data-id="${id}">Barchasini ko‘rish</button></div></div></div></div>`}
function sett(){const tabs=['Asosiy sozlamalar','Xavfsizlik','Bildirishnomalar'].map((t,i)=>`<button class="${i===STAB?'on':''}" data-act="tab" data-t="${i}">${t}</button>`).join('');let b;
if(STAB===0)b=`<div class="g2">${fl('Tuman nomi','st',CFG.tuman)}${fl('Tizim nomi','ss',CFG.sys)}${fl('Email','se',CFG.email,'email')}${fl('Telefon','sp',CFG.tel,'tel')}</div><button class="bt" style="margin-top:20px" data-act="saveS">Saqlash</button>`;
else if(STAB===1)b=`<div class="fg" style="max-width:420px">${fl('Login','pl',CFG.login)}${fl('Eski parol','po','','password','Eski parol')}${fl('Yangi parol','pn','','password','Kamida 8 ta belgi')}${fl('Yangi parolni tasdiqlang','pc','','password','Yangi parolni tasdiqlang')}<button class="bt" data-act="saveP">Saqlash</button></div>`;
else b=`<div style="max-width:520px">${['Yangi foydalanuvchi ro‘yxatdan o‘tganda xabar berish','Yangi tadbir qo‘shilganda xabar berish','Tizim yangilanishlari haqida xabar berish'].map((t,i)=>`<label class="sw"><input type="checkbox" id="n${i}"${CFG.n[i]?' checked':''}>${t}</label>`).join('')}<button class="bt" style="margin-top:16px" data-act="saveN">Saqlash</button></div>`;
return `<div class="card" style="max-width:760px"><div class="tabs">${tabs}</div>${b}</div>`}
function search(q){q=q.trim().toLowerCase();const w=$('#sr').parentNode;if(!q){w.classList.remove('open');return}
const ev=EV.filter(e=>(e.title+' '+LOCS[e.loc].n+' '+TYPES[e.t]).toLowerCase().includes(q)).slice(0,5),us=US.filter(u=>u.n.toLowerCase().includes(q)).slice(0,3);
$('#sr').innerHTML=(ev.map(e=>`<a class="mi" href="#tadbir-${e.id}">${E(e.title)}<br><span class="sm">${fd(e.date)} · ${E(LOCS[e.loc].n)}</span></a>`).join('')+us.map(u=>`<button class="mi" data-act="su" data-q="${E(u.n)}">${E(u.n)}<br><span class="sm">Foydalanuvchi · ${u.r}</span></button>`).join(''))||'<div class="mi sm">Hech narsa topilmadi</div>';w.classList.add('open')}
function render(){R=location.hash.slice(1)||'dashboard';ZM=1;const m=R.match(/^tadbir-(\d+)$/);
$$('.nav').forEach(a=>a.classList.toggle('on',a.getAttribute('href')==='#'+(m?'tadbirlar':R)));
$('#hd').innerHTML=hd(R,m);$('#pg').innerHTML=m?det(+m[1]):R==='foydalanuvchilar'?users():R==='mahalla'?mahalla():R==='tadbirlar'?evl():R==='tadbir-qoshish'?add():R==='sozlamalar'?sett():dash();
if(R==='foydalanuvchilar')updUsers();if(R==='mahalla')updMh();if(R==='tadbirlar')updEv(1);clk();countUp();window.scrollTo(0,0)}
const clk=()=>{const c=$('#clk'),n=new Date();if(c)c.textContent=pad(n.getHours())+':'+pad(n.getMinutes())};setInterval(clk,30000);
const A={tg(a){a.closest('.pw').classList.toggle('open')},bell(a){NB=0;$('#bdg')?.remove();A.tg(a)},
theme(){const d=document.documentElement,n=d.dataset.theme==='light'?'dark':'light';d.dataset.theme=n;LS.s('theme',n)},
out(){toast('Demo rejimida chiqish o‘chirilgan')},more(){EQ.n+=12;updEv()},back(){history.length>1?history.back():location.hash='dashboard'},
day(a,d){CAL.s=d.k;$('#cb').innerHTML=calH()},
mo(a,d){CAL.m+=+d.d;if(CAL.m<0){CAL.m=11;CAL.y--}if(CAL.m>11){CAL.m=0;CAL.y++}$('#cb').innerHTML=calH()},
zm(a,d){ZM=Math.min(2.5,Math.max(1,ZM+d.d*.5));$('#mg').setAttribute('transform',ztf())},
pin(a,d){const i=+d.i;if(R==='tadbir-qoshish'){AF.loc=i;$('#al').value=i;err('al','');$('#am').innerHTML=mapH({sel:i})}else{$('#ms').innerHTML=mapH({sel:i});const L=EV.filter(e=>e.loc===i&&e.date===TODAY).sort((x,y)=>x.time<y.time?-1:1);$('#mp').innerHTML=`<b>${E(LOCS[i].n)}</b><br>Bugun ${L.length} ta tadbir`+L.slice(0,4).map(e=>`<a class="ml" href="#tadbir-${e.id}">${e.time} · ${E(e.title)}</a>`).join('')}$('#ms [data-i="'+i+'"]')?.focus()},
reg(a,d){const id=+d.id;REG=REG.includes(id)?REG.filter(x=>x!==id):[...REG,id];LS.s('reg',REG);$('#pg').innerHTML=det(id);toast(REG.includes(id)?'Ro‘yxatdan o‘tdingiz':'Ro‘yxatdan o‘tish bekor qilindi')},
all(a,d){const e=EV.find(x=>x.id==d.id);$('#mod').innerHTML=`<div class="ov2" data-act="close"><div class="md" role="dialog" aria-modal="true" aria-label="Qatnashuvchilar" data-stop="1"><h2 class="h">Qatnashuvchilar (${e.going})</h2>${parts(e,12).map(u=>`<div class="ir"><span class="av" style="width:30px;height:30px;font-size:12px">${u.n[0]}</span>${E(u.n)}<span class="sm" style="margin-left:auto">${u.r}</span></div>`).join('')}<button class="bt g" style="width:100%;margin-top:10px" data-act="close">Yopish</button></div></div>`;$('#mod button')?.focus()},
close(a,d,e){if(a.classList.contains('ov2')&&e.target.closest('[data-stop]'))return;$('#mod').innerHTML=''},
su(a,d){UQ.q=d.q;UQ.p=1;UQ.r='';location.hash='foydalanuvchilar'},
blk(a,d){const u=US[d.id-1];u.s=u.s===2?0:2;updUsers();toast(u.n+': '+SN[u.s])},
pg(a,d){UQ.p=+d.p;updUsers()},
exp(){const c='Ism,Telefon,Rol,Sana,Status\n'+updUsers.L.slice(0,500).map(u=>[u.n,u.p,u.r,u.d,SN[u.s]].join(',')).join('\n');(navigator.clipboard?navigator.clipboard.writeText(c):Promise.reject()).then(()=>toast('CSV nusxalandi ('+Math.min(500,updUsers.L.length)+' ta qator)'),()=>toast('Brauzer nusxalashga ruxsat bermadi'))},
tab(a,d){STAB=+d.t;$('#pg').innerHTML=sett()},
cancel(){AF={loc:-1,img:''};location.hash==='#dashboard'?render():location.hash='dashboard'},
save(){const v=id=>$('#'+id).value.trim();let ok=1;const need=(id,m)=>{const b=!v(id)||v(id)==='-1';err(id,b?m:'');if(b)ok=0};need('an','Tadbir nomini kiriting');need('al','Lokatsiyani tanlang');need('ad','Sanani tanlang');need('ax','Tavsifni kiriting');
if(!ok){toast('Majburiy maydonlarni to‘ldiring');return}
const e={id:Math.max(...EV.map(x=>x.id))+1,t:+v('at'),title:v('an'),loc:+v('al'),date:v('ad'),time:v('av')||'09:00',ages:'15–25 yosh',going:0,desc:v('ax'),img:AF.img};EV.push(e);ADD.push(e);LS.s('added',ADD);AF={loc:-1,img:''};toast('Tadbir saqlandi');location.hash='tadbir-'+e.id},
saveS(){const v=id=>$('#'+id).value.trim();let ok=1;const c=(id,b,m)=>{err(id,b?m:'');if(b)ok=0};c('st',!v('st'),'Tuman nomini kiriting');c('ss',!v('ss'),'Tizim nomini kiriting');c('se',!/^\S+@\S+\.\S+$/.test(v('se')),'Email noto‘g‘ri');c('sp',v('sp').replace(/\D/g,'').length<9,'Telefon raqami noto‘g‘ri');if(!ok)return;
Object.assign(CFG,{tuman:v('st'),sys:v('ss'),email:v('se'),tel:v('sp')});LS.s('cfg',CFG);side();toast('Sozlamalar saqlandi')},
saveP(){const v=id=>$('#'+id).value;let ok=1;const c=(id,b,m)=>{err(id,b?m:'');if(b)ok=0};c('pl',!v('pl').trim(),'Login kiriting');c('po',!v('po'),'Eski parolni kiriting');c('pn',v('pn').length<8,'Kamida 8 ta belgi kiriting');if(v('pn').length>=8)c('pn',v('pn')===v('po'),'Yangi parol eskisidan farq qilishi kerak');c('pc',v('pc')!==v('pn'),'Parollar mos kelmadi');if(!ok)return;
CFG.login=v('pl').trim();LS.s('cfg',CFG);['po','pn','pc'].forEach(i=>$('#'+i).value='');toast('Parol o‘zgartirildi (demo)')},
saveN(){CFG.n=[0,1,2].map(i=>$('#n'+i).checked?1:0);LS.s('cfg',CFG);toast('Bildirishnoma sozlamalari saqlandi')}};
document.addEventListener('click',e=>{const w=e.target.closest('.pw');$$('.pw.open').forEach(x=>{if(x!==w)x.classList.remove('open')});const a=e.target.closest('[data-act]');if(a&&A[a.dataset.act])A[a.dataset.act](a,a.dataset,e)});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){$('#mod').innerHTML='';$$('.pw.open').forEach(x=>x.classList.remove('open'))}if((e.key==='Enter'||e.key===' ')&&e.target.matches('g[data-act]')){e.preventDefault();e.target.dispatchEvent(new MouseEvent('click',{bubbles:true}))}});
document.addEventListener('input',e=>{const t=e.target;if(t.id==='gs')search(t.value);if(t.id==='uq'){UQ.q=t.value;UQ.p=1;updUsers()}if(t.id==='eq'){EQ.q=t.value;EQ.n=12;updEv()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id==='et'){EQ.t=t.value;EQ.n=12;updEv()}if(t.id==='ms2'){MSORT=t.value;updMh()}if(t.id==='ur'){UQ.r=t.value;UQ.p=1;updUsers()}if(t.id==='uz'){UQ.z=+t.value;UQ.p=1;updUsers()}
if(t.id==='al'){AF.loc=+t.value;err('al','');$('#am').innerHTML=mapH({sel:AF.loc})}
if(t.id==='af'&&t.files[0]){const f=t.files[0];if(!/^image\/(png|jpeg)$/.test(f.type)||f.size>5e6){err('af','Faqat PNG yoki JPG, 5MB gacha');t.value='';return}err('af','');const r=new FileReader();r.onload=()=>{AF.img=r.result;$('#prev').innerHTML=`<img src="${AF.img}" alt="Tanlangan rasm">`};r.readAsDataURL(f)}});
const countUp=()=>{if(matchMedia('(prefers-reduced-motion:reduce)').matches)return;$$('[data-n]').forEach(el=>{const to=+el.dataset.n,t0=performance.now(),f=t=>{const k=Math.min(1,(t-t0)/900);el.textContent=nf(Math.round(to*(1-Math.pow(1-k,3))));if(k<1)requestAnimationFrame(f)};requestAnimationFrame(f)})};
window.addEventListener('hashchange',render);side();render();
</script>
</body>
</html>
