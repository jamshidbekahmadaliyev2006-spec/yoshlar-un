version: '3.8'

services:
  postgres:
    image: postgis/postgis:16-3.4
    container_name: yunusobod_postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: yunusobod_birga
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d yunusobod_birga"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - yunusobod_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: yunusobod_backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/yunusobod_birga?schema=public
      JWT_SECRET: ${JWT_SECRET:-your_jwt_secret_key_here}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-your_admin_password_here}
      CLIENT_URL: http://localhost:3000
      UPLOAD_DIR: uploads
    ports:
      - "5000:5000"
    volumes:
      - backend_uploads:/app/uploads
    networks:
      - yunusobod_network

  admin:
    build:
      context: ./admin
      dockerfile: Dockerfile
    container_name: yunusobod_admin
    restart: always
    depends_on:
      - backend
    ports:
      - "3000:80"
    networks:
      - yunusobod_network

volumes:
  postgres_data:
  backend_uploads:

networks:
  yunusobod_network:
    driver: bridge

